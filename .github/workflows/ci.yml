name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format
        run: ruff format --check .

      - name: Mypy — vérification des types
        run: mypy . --ignore-missing-imports

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: pytest --cov --cov-report=term-missing

  security:
    name: Analyse de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Bandit — SAST
        run: bandit --quiet --recursive --skip=B101 config/ core/ services/ rag/ ui/

      - name: Safety — vulnérabilités connues
        run: safety check --bare 2>/dev/null || true

  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [tests, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Construire le tag en minuscules
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          echo "IMAGE_TAG=ghcr.io/${OWNER,,}/chatbot:${SHA,,}" >> $GITHUB_ENV
          echo "LATEST_TAG=ghcr.io/${OWNER,,}/chatbot:latest" >> $GITHUB_ENV
          echo "SEMVER_TAG=ghcr.io/${OWNER,,}/chatbot:${REF,,}" >> $GITHUB_ENV

      - name: Build l'image Docker
        run: docker build -t ${{ env.IMAGE_TAG }} .

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Scanner l'image avec Trivy
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH \
            ${{ env.IMAGE_TAG }}

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_TAG }} ${{ env.LATEST_TAG }}
          docker push ${{ env.LATEST_TAG }}

      - name: Push tag semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.IMAGE_TAG }} ${{ env.SEMVER_TAG }}
          docker push ${{ env.SEMVER_TAG }}
